# STG-01/04: real SPPS attempt on Linux CI without Docker Desktop on the owner machine.
# Downloads pinned SPPS artifact (gh), runs adapter gates + fixture attempt, uploads report.
#
# Requires engine/fixtures/minimal_room/inputs (config.xml + official mesh/tetramesh).
# Success = SPPS exit + validate_outputs OK. No invented heatmap / dB values.

name: Run SPPS Job

"on":
  workflow_dispatch:
  push:
    paths:
      - "engine/adapter/**"
      - "engine/fixtures/**"
      - "engine/PINNED.json"
      - "engine/scripts/prepare-minimal-room-fixture.*"
      - "engine/scripts/adapt-minimal-room-config.py"
      - ".github/workflows/run-spps-job.yml"

concurrency:
  group: run-spps-job-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attempt-fixture:
    name: Adapter + SPPS fixture attempt (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout SonoPlan
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read pin + prepare dirs
        id: pin
        run: |
          mkdir -p ci-spps-job engine/binaries/spps-ci
          python3 <<'PY'
          import json, os
          from pathlib import Path
          pin = json.loads(Path("engine/PINNED.json").read_text(encoding="utf-8"))
          art = pin.get("binary_artifact") or {}
          commit = pin["isimpa"]["commit"]
          short = commit[:12]
          artifact = art.get("artifact_name") or f"spps-linux-x86_64-{short}"
          run_id = art.get("github_run_id") or ""
          checksum = pin.get("binary_checksum") or ""
          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as fh:
              fh.write(f"commit={commit}\n")
              fh.write(f"short={short}\n")
              fh.write(f"checksum={checksum}\n")
              fh.write(f"artifact={artifact}\n")
              fh.write(f"run_id={run_id}\n")
          print(f"artifact={artifact} run_id={run_id}")
          PY

      - name: Verify fixture inputs present
        run: |
          set -euo pipefail
          IN="engine/fixtures/minimal_room/inputs"
          for f in config.xml mesh.cbin tetramesh.mbin speaker-test3.txt ORIGIN.txt; do
            test -f "$IN/$f" || { echo "MISSING $IN/$f"; exit 1; }
          done
          ls -la "$IN"
          cat "$IN/ORIGIN.txt"

      - name: Download SPPS artifact (gh)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.pin.outputs.run_id }}"
          ART="${{ steps.pin.outputs.artifact }}"
          DEST="engine/binaries/spps-ci"
          if [[ -n "$RUN_ID" ]]; then
            gh run download "$RUN_ID" --repo "${{ github.repository }}" -n "$ART" -D "$DEST" || true
          fi
          if ! find "$DEST" -type f -name spps | grep -q .; then
            echo "Pinned run download missed; trying latest successful Build SPPS run…"
            LATEST=$(gh run list --repo "${{ github.repository }}" --workflow build-spps.yml --status success --limit 1 --json databaseId -q '.[0].databaseId' || true)
            if [[ -n "$LATEST" && "$LATEST" != "null" ]]; then
              gh run download "$LATEST" --repo "${{ github.repository }}" -n "$ART" -D "$DEST" || true
            fi
          fi

      - name: Locate SPPS binary
        id: bin
        run: |
          set -euo pipefail
          FOUND=$(find engine/binaries -type f -name spps 2>/dev/null | head -n1 || true)
          if [[ -z "$FOUND" ]]; then
            echo "found=0" >> "$GITHUB_OUTPUT"
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "spps binary not found" | tee ci-spps-job/binary_missing.txt
            exit 0
          fi
          chmod +x "$FOUND"
          # Absolute path: later steps use working-directory engine/adapter.
          ABS="$(cd "$(dirname "$FOUND")" && pwd)/$(basename "$FOUND")"
          echo "found=1" >> "$GITHUB_OUTPUT"
          echo "path=$ABS" >> "$GITHUB_OUTPUT"
          sha256sum "$ABS" | tee ci-spps-job/sha256.txt

      - name: Verify checksum when present
        if: steps.bin.outputs.found == '1' && steps.pin.outputs.checksum != ''
        run: |
          set -euo pipefail
          ACTUAL=$(sha256sum "${{ steps.bin.outputs.path }}" | awk '{print $1}')
          EXPECTED="${{ steps.pin.outputs.checksum }}"
          echo "actual=$ACTUAL expected=$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"

      - name: Adapter unit tests (no binary required)
        working-directory: engine/adapter
        run: python -m unittest tests.test_validate_outputs -v

      - name: ENG-009 broken_exit0 must fail validation
        working-directory: engine/adapter
        run: |
          set +e
          python -m sonoplan_adapter.cli validate-outputs ../fixtures/broken_exit0 \
            --manifest ../fixtures/broken_exit0/manifest.json --exit-code 0 \
            > ../../ci-spps-job/broken_exit0_report.json
          CODE=$?
          set -e
          echo "broken_exit0_exit=$CODE" | tee ../../ci-spps-job/broken_exit0_exit.txt
          test "$CODE" -ne 0

      - name: Fail clearly when SPPS binary missing
        if: steps.bin.outputs.found != '1'
        run: |
          cat > ci-spps-job/attempt_run.json <<'EOF'
          {
            "ok": false,
            "error_code": "SPPS_BIN_MISSING",
            "error_message": "Could not download SPPS artifact; re-run Build SPPS or check PINNED.json run_id."
          }
          EOF
          exit 1

      - name: check-env + attempt-run fixture
        env:
          SPPS_BIN: ${{ steps.bin.outputs.path }}
        working-directory: engine/adapter
        run: |
          set -euo pipefail
          python -m sonoplan_adapter.cli check-env --spps-bin "$SPPS_BIN" \
            | tee ../../ci-spps-job/check_env.json
          set +e
          python -m sonoplan_adapter.cli attempt-run ../fixtures/minimal_room/inputs \
            --required-input config.xml \
            --required-input mesh.cbin \
            --required-input tetramesh.mbin \
            --required-input speaker-test3.txt \
            --report ../../ci-spps-job/attempt_run.json
          CODE=$?
          set -e
          echo "attempt_exit=$CODE" | tee ../../ci-spps-job/attempt_exit.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          rep = Path("../../ci-spps-job/attempt_run.json")
          if rep.is_file():
              data = json.loads(rep.read_text(encoding="utf-8"))
              print("--- stdout_tail ---")
              print(data.get("stdout_tail") or "(empty)")
              print("--- stderr_tail ---")
              print(data.get("stderr_tail") or "(empty)")
          PY
          find ../fixtures/minimal_room/inputs -type f | tee ../../ci-spps-job/workdir_listing.txt
          test "$CODE" -eq 0

      - name: validate-outputs (no fake dB)
        if: success()
        working-directory: engine/adapter
        run: |
          set -euo pipefail
          python -m sonoplan_adapter.cli validate-outputs ../fixtures/minimal_room/inputs \
            --manifest ../fixtures/minimal_room/manifest.json --exit-code 0 \
            | tee ../../ci-spps-job/validate_outputs.json
          # Preserve a few real binary outputs in the report artifact (not invented maps).
          mkdir -p ../../ci-spps-job/outputs
          if [[ -d "../fixtures/minimal_room/inputs/Punctual receivers" ]]; then
            cp -a "../fixtures/minimal_room/inputs/Punctual receivers" ../../ci-spps-job/outputs/ || true
          fi
          if [[ -f ../fixtures/minimal_room/inputs/statsSPPS.gabe ]]; then
            cp -a ../fixtures/minimal_room/inputs/statsSPPS.gabe ../../ci-spps-job/outputs/ || true
          fi

      - name: Upload job report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spps-job-report-${{ github.run_id }}
          path: ci-spps-job/
          if-no-files-found: warn
          retention-days: 30

      - name: Job summary
        if: always()
        run: |
          {
            echo "## SPPS job attempt"
            echo ""
            echo "- Artifact pin: \`${{ steps.pin.outputs.artifact }}\`"
            echo "- Binary found: \`${{ steps.bin.outputs.found }}\`"
            echo "- Path: \`${{ steps.bin.outputs.path }}\`"
            echo "- Fixture: \`engine/fixtures/minimal_room\` (official I-Simpa python_bindings mesh)"
            echo ""
            echo "Success requires real SPPS outputs + \`validate-outputs\`."
            echo "No heatmap / invented dB values are published by this workflow."
            if [[ -f ci-spps-job/attempt_run.json ]]; then
              echo ""
              echo '```json'
              cat ci-spps-job/attempt_run.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
