# STG-01/04: real SPPS attempt on Linux CI without Docker Desktop on the owner machine.
# Downloads pinned SPPS artifact (gh), runs adapter gates + fixture attempt, uploads report.
#
# Requires engine/fixtures/minimal_room/inputs (config.xml + official mesh/tetramesh).
# Success = SPPS exit + validate_outputs OK. No invented heatmap / dB values.

name: Run SPPS Job

"on":
  workflow_dispatch:
  # After a successful Build SPPS: use the fresh artifact (pin may lag).
  workflow_run:
    workflows: ["Build SPPS"]
    types: [completed]
  push:
    paths:
      - "engine/adapter/**"
      - "engine/fixtures/**"
      - "engine/PINNED.json"
      - "engine/scripts/prepare-minimal-room-fixture.*"
      - "engine/scripts/adapt-minimal-room-config.py"
      - "engine/scripts/prepare-official-spps-control.py"
      - "engine/scripts/patch-tetramesh-idvolume.py"
      - ".github/workflows/run-spps-job.yml"

concurrency:
  group: run-spps-job-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attempt-fixture:
    name: Adapter + SPPS fixture attempt (ubuntu-22.04)
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout SonoPlan
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read pin + prepare dirs
        id: pin
        run: |
          mkdir -p ci-spps-job engine/binaries/spps-ci
          python3 <<'PY'
          import json, os
          from pathlib import Path
          pin = json.loads(Path("engine/PINNED.json").read_text(encoding="utf-8"))
          art = pin.get("binary_artifact") or {}
          commit = pin["isimpa"]["commit"]
          short = commit[:12]
          artifact = art.get("artifact_name") or f"spps-linux-x86_64-{short}"
          run_id = art.get("github_run_id") or ""
          checksum = pin.get("binary_checksum") or ""
          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as fh:
              fh.write(f"commit={commit}\n")
              fh.write(f"short={short}\n")
              fh.write(f"checksum={checksum}\n")
              fh.write(f"artifact={artifact}\n")
              fh.write(f"run_id={run_id}\n")
          print(f"artifact={artifact} run_id={run_id}")
          PY

      - name: Verify fixture inputs present
        run: |
          set -euo pipefail
          IN="engine/fixtures/minimal_room/inputs"
          for f in config.xml mesh.cbin tetramesh.mbin speaker-test3.txt ORIGIN.txt; do
            test -f "$IN/$f" || { echo "MISSING $IN/$f"; exit 1; }
          done
          ls -la "$IN"
          cat "$IN/ORIGIN.txt"

      - name: Download SPPS artifact (gh)
        id: dl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.pin.outputs.run_id }}"
          ART="${{ steps.pin.outputs.artifact }}"
          DEST="engine/binaries/spps-ci"
          USED_LATEST=0
          # Prefer the Build SPPS run that triggered us (workflow_run).
          # Path A: no experimental patch marker gate — see docs/spps-energy-blocker.md
          TRIGGER_RUN="${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}"
          if [[ -n "$TRIGGER_RUN" ]]; then
            echo "workflow_run trigger: downloading Build SPPS run $TRIGGER_RUN"
            rm -rf "$DEST"
            mkdir -p "$DEST"
            gh run download "$TRIGGER_RUN" --repo "${{ github.repository }}" -n "$ART" -D "$DEST" || true
            USED_LATEST=1
          elif [[ -n "$RUN_ID" ]]; then
            gh run download "$RUN_ID" --repo "${{ github.repository }}" -n "$ART" -D "$DEST" || true
          fi
          SPPS_FILE=$(find "$DEST" -type f -name spps 2>/dev/null | head -n1 || true)
          if [[ -z "$SPPS_FILE" ]]; then
            echo "Pinned/trigger download missed; need latest successful Build SPPS"
            LATEST=$(gh run list --repo "${{ github.repository }}" --workflow build-spps.yml --status success --limit 1 --json databaseId -q '.[0].databaseId' || true)
            if [[ -n "$LATEST" && "$LATEST" != "null" ]]; then
              gh run download "$LATEST" --repo "${{ github.repository }}" -n "$ART" -D "$DEST" || true
              USED_LATEST=1
            fi
          fi
          echo "used_latest=$USED_LATEST" >> "$GITHUB_OUTPUT"

      - name: Locate SPPS binary
        id: bin
        run: |
          set -euo pipefail
          FOUND=$(find engine/binaries -type f -name spps 2>/dev/null | head -n1 || true)
          if [[ -z "$FOUND" ]]; then
            echo "found=0" >> "$GITHUB_OUTPUT"
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "spps binary not found" | tee ci-spps-job/binary_missing.txt
            exit 0
          fi
          chmod +x "$FOUND"
          # Absolute path: later steps use working-directory engine/adapter.
          ABS="$(cd "$(dirname "$FOUND")" && pwd)/$(basename "$FOUND")"
          echo "found=1" >> "$GITHUB_OUTPUT"
          echo "path=$ABS" >> "$GITHUB_OUTPUT"
          sha256sum "$ABS" | tee ci-spps-job/sha256.txt
          echo "OK: SPPS binary located (experimental patches paused; marker not required)"

      - name: Verify checksum when present
        if: steps.bin.outputs.found == '1' && steps.pin.outputs.checksum != '' && steps.dl.outputs.used_latest != '1'
        run: |
          set -euo pipefail
          ACTUAL=$(sha256sum "${{ steps.bin.outputs.path }}" | awk '{print $1}')
          EXPECTED="${{ steps.pin.outputs.checksum }}"
          echo "actual=$ACTUAL expected=$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"

      - name: Adapter unit tests (no binary required)
        working-directory: engine/adapter
        run: python -m unittest discover -s tests -v

      - name: ENG-009 broken_exit0 must fail validation
        working-directory: engine/adapter
        run: |
          set +e
          python -m sonoplan_adapter.cli validate-outputs ../fixtures/broken_exit0 \
            --manifest ../fixtures/broken_exit0/manifest.json --exit-code 0 \
            > ../../ci-spps-job/broken_exit0_report.json
          CODE=$?
          set -e
          echo "broken_exit0_exit=$CODE" | tee ../../ci-spps-job/broken_exit0_exit.txt
          test "$CODE" -ne 0

      - name: Fail clearly when SPPS binary missing
        if: steps.bin.outputs.found != '1'
        run: |
          cat > ci-spps-job/attempt_run.json <<'EOF'
          {
            "ok": false,
            "error_code": "SPPS_BIN_MISSING",
            "error_message": "Could not download SPPS artifact; re-run Build SPPS or check PINNED.json run_id."
          }
          EOF
          exit 1

      - name: Checkout pinned I-Simpa (official control assets)
        uses: actions/checkout@v4
        with:
          repository: Universite-Gustave-Eiffel/I-Simpa
          ref: ${{ steps.pin.outputs.commit }}
          path: .tmp-isimpa-ci
          fetch-depth: 1

      - name: Official SPPS control (upstream config+cube, locale-safe only)
        id: official
        env:
          SPPS_BIN: ${{ steps.bin.outputs.path }}
        run: |
          set -euo pipefail
          OUT="engine/fixtures/official_spps_control/inputs"
          python3 engine/scripts/prepare-official-spps-control.py \
            --isimpa-root .tmp-isimpa-ci \
            --out-dir "$OUT" \
            --seed 1
          # Control A: raw upstream cube idVolume (may be 1).
          mkdir -p ci-spps-job/official_control
          set +e
          (
            cd engine/adapter
            python -m sonoplan_adapter.cli attempt-run ../fixtures/official_spps_control/inputs \
              --required-input config.xml \
              --required-input mesh.cbin \
              --required-input tetramesh.mbin \
              --required-input speaker-test3.txt \
              --report ../../ci-spps-job/official_control/attempt_run_raw.json
          )
          RAW=$?
          set -e
          echo "official_raw_exit=$RAW" | tee ci-spps-job/official_control/attempt_exit_raw.txt
          # Decode energy without failing the job yet — compare to minimal_room.
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "engine/adapter")
          from sonoplan_adapter.results import read_punctual_sound_level
          root = Path("engine/fixtures/official_spps_control/inputs/Punctual receivers")
          rows = []
          if root.is_dir():
              for recp in sorted(root.glob("*/Sound level.recp")):
                  r = read_punctual_sound_level(recp)
                  rows.append({
                      "receiverId": recp.parent.name,
                      "energySumGlobal": r.energy_sum_global,
                      "lpDbGlobal": r.lp_db_global,
                  })
          summary = {"receivers": rows, "nonzero": [x for x in rows if (x["energySumGlobal"] or 0) > 0]}
          Path("ci-spps-job/official_control/energy_raw.json").write_text(
              json.dumps(summary, indent=2), encoding="utf-8"
          )
          print("official_raw_nonzero", summary["nonzero"])
          open("ci-spps-job/official_control/has_energy_raw.txt", "w", encoding="utf-8").write(
              "1" if summary["nonzero"] else "0"
          )
          PY
          # Control B: same inputs but idVolume forced to 0 (principal volume).
          python3 engine/scripts/patch-tetramesh-idvolume.py \
            engine/fixtures/official_spps_control/inputs/tetramesh.mbin --volume 0
          set +e
          (
            cd engine/adapter
            # wipe previous SPPS outputs so decode is from this run
            rm -rf ../fixtures/official_spps_control/inputs/"Punctual receivers" \
                   ../fixtures/official_spps_control/inputs/statsSPPS.gabe || true
            python -m sonoplan_adapter.cli attempt-run ../fixtures/official_spps_control/inputs \
              --required-input config.xml \
              --required-input mesh.cbin \
              --required-input tetramesh.mbin \
              --required-input speaker-test3.txt \
              --report ../../ci-spps-job/official_control/attempt_run_idv0.json
          )
          IDV=$?
          set -e
          echo "official_idv0_exit=$IDV" | tee ci-spps-job/official_control/attempt_exit_idv0.txt
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "engine/adapter")
          from sonoplan_adapter.results import read_punctual_sound_level
          root = Path("engine/fixtures/official_spps_control/inputs/Punctual receivers")
          rows = []
          if root.is_dir():
              for recp in sorted(root.glob("*/Sound level.recp")):
                  r = read_punctual_sound_level(recp)
                  rows.append({
                      "receiverId": recp.parent.name,
                      "energySumGlobal": r.energy_sum_global,
                      "lpDbGlobal": r.lp_db_global,
                  })
          summary = {"receivers": rows, "nonzero": [x for x in rows if (x["energySumGlobal"] or 0) > 0]}
          Path("ci-spps-job/official_control/energy_idv0.json").write_text(
              json.dumps(summary, indent=2), encoding="utf-8"
          )
          print("official_idv0_nonzero", summary["nonzero"])
          open("ci-spps-job/official_control/has_energy_idv0.txt", "w", encoding="utf-8").write(
              "1" if summary["nonzero"] else "0"
          )
          PY
          echo "official_control_done=1" >> "$GITHUB_OUTPUT"

      - name: check-env + attempt-run fixture
        env:
          SPPS_BIN: ${{ steps.bin.outputs.path }}
        working-directory: engine/adapter
        run: |
          set -euo pipefail
          python -m sonoplan_adapter.cli check-env --spps-bin "$SPPS_BIN" \
            | tee ../../ci-spps-job/check_env.json
          set +e
          python -m sonoplan_adapter.cli attempt-run ../fixtures/minimal_room/inputs \
            --required-input config.xml \
            --required-input mesh.cbin \
            --required-input tetramesh.mbin \
            --required-input speaker-test3.txt \
            --report ../../ci-spps-job/attempt_run.json
          CODE=$?
          set -e
          echo "attempt_exit=$CODE" | tee ../../ci-spps-job/attempt_exit.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          rep = Path("../../ci-spps-job/attempt_run.json")
          if rep.is_file():
              data = json.loads(rep.read_text(encoding="utf-8"))
              print("--- stdout_tail ---")
              print(data.get("stdout_tail") or "(empty)")
              print("--- stderr_tail ---")
              print(data.get("stderr_tail") or "(empty)")
          PY
          find ../fixtures/minimal_room/inputs -type f | tee ../../ci-spps-job/workdir_listing.txt
          test "$CODE" -eq 0

      - name: validate-outputs (no fake dB)
        if: success()
        working-directory: engine/adapter
        run: |
          set -euo pipefail
          python -m sonoplan_adapter.cli validate-outputs ../fixtures/minimal_room/inputs \
            --manifest ../fixtures/minimal_room/manifest.json --exit-code 0 \
            | tee ../../ci-spps-job/validate_outputs.json
          # Preserve a few real binary outputs in the report artifact (not invented maps).
          mkdir -p ../../ci-spps-job/outputs
          if [[ -d "../fixtures/minimal_room/inputs/Punctual receivers" ]]; then
            cp -a "../fixtures/minimal_room/inputs/Punctual receivers" ../../ci-spps-job/outputs/ || true
          fi
          if [[ -f ../fixtures/minimal_room/inputs/statsSPPS.gabe ]]; then
            cp -a ../fixtures/minimal_room/inputs/statsSPPS.gabe ../../ci-spps-job/outputs/ || true
          fi
          if [[ -f "../fixtures/minimal_room/inputs/Total energy.recp" ]]; then
            cp -a "../fixtures/minimal_room/inputs/Total energy.recp" ../../ci-spps-job/outputs/ || true
            python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, ".")
          from sonoplan_adapter.gabe import load_gabe
          p = Path("../fixtures/minimal_room/inputs/Total energy.recp")
          t = load_gabe(p)
          rows = []
          for c in t.columns:
              if c.floats is not None:
                  s = float(sum(c.floats))
                  rows.append({"label": c.label, "energySum": s, "nz": sum(1 for v in c.floats if v != 0)})
          summary = {"path": str(p), "bands": rows, "nonzero": [r for r in rows if (r["energySum"] or 0) > 0]}
          Path("../../ci-spps-job/outputs/total_energy_summary.json").write_text(
              json.dumps(summary, indent=2), encoding="utf-8"
          )
          print("total_energy_nonzero", summary["nonzero"])
          PY
          fi

      - name: decode-outputs + ResultManifest (post-SPPS)
        if: success()
        working-directory: engine/adapter
        run: |
          set -euo pipefail
          # Decode real .recp (GABE energy); write ResultManifest JSON into artifact.
          # mapAvailable stays false — no invented heatmap from punctual files.
          python -m sonoplan_adapter.cli decode-outputs ../fixtures/minimal_room/inputs \
            --job-id "ci-${{ github.run_id }}" \
            --revision-id "fixture-minimal_room" \
            --snapshot-hash "$(python3 -c 'print("0"*64)')" \
            --manifest-out ../../ci-spps-job/result_manifest.json \
            | tee ../../ci-spps-job/decode_outputs.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          man = json.loads(Path("../../ci-spps-job/result_manifest.json").read_text(encoding="utf-8"))
          assert man.get("mapAvailable") is False, "must not publish invented heatmap"
          assert man.get("quantity") == "energy_p2_homogeneous"
          assert man.get("sci003Golden", {}).get("status") == "decoder_ok_golden_pending"
          punctual = man.get("punctualReceivers") or []
          assert punctual, "expected at least one decoded punctual receiver"
          nonzero = []
          for p in punctual:
              e = p.get("energySumGlobal", 0) or 0
              lp = p.get("lpDbGlobal")
              if e == 0:
                  assert lp is None, "zero energy must not become 0 dB"
              else:
                  assert lp is not None, f"{p.get('receiverId')}: nonzero energy must yield finite lpDb"
                  assert lp == lp, f"{p.get('receiverId')}: lpDb must not be NaN"
                  nonzero.append((p.get("receiverId"), e, lp))
          # Path A: energy=0 on headless is a known blocker (paused) — do not fail CI
          # and do not invent dB. See docs/spps-energy-blocker.md
          if not nonzero:
              print(
                  "KNOWN_BLOCKER: energySumGlobal=0 on all punctual receivers "
                  "(paused; honesty gate: lpDb=null, mapAvailable=false)"
              )
          else:
              print("result_manifest OK:", len(punctual), "receivers; nonzero=", nonzero)
          print("mapAvailable=false")
          PY

      - name: Upload job report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spps-job-report-${{ github.run_id }}
          path: ci-spps-job/
          if-no-files-found: warn
          retention-days: 30

      - name: Job summary
        if: always()
        run: |
          {
            echo "## SPPS job attempt"
            echo ""
            echo "- Artifact pin: \`${{ steps.pin.outputs.artifact }}\`"
            echo "- Binary found: \`${{ steps.bin.outputs.found }}\`"
            echo "- Path: \`${{ steps.bin.outputs.path }}\`"
            echo "- Fixture: \`engine/fixtures/minimal_room\` (official I-Simpa cube 5x5x5 mesh)"
            echo ""
            echo "Success requires real SPPS outputs + \`validate-outputs\`."
            echo "No heatmap / invented dB values are published by this workflow."
            if [[ -f ci-spps-job/attempt_run.json ]]; then
              echo ""
              echo '```json'
              cat ci-spps-job/attempt_run.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
