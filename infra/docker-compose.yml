# SonoPlan local stack (DEV-002 / OPS).
# api / worker / web images are stubs until services ship Dockerfiles.
name: sonoplan

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sonoplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sonoplan}
      POSTGRES_DB: ${POSTGRES_DB:-sonoplan}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sonoplan} -d ${POSTGRES_DB:-sonoplan}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-sonoplan}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-sonoplan}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sonoplan}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sonoplan_dev_minio}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    # Healthcheck omitted: official MinIO image may lack curl/mc in PATH.

  # --- application stubs (profiles) ---
  api:
    profiles: ["apps"]
    image: busybox:1.36
    command: ["sh", "-c", "echo 'api image stub — build services/api Dockerfile later'; sleep infinity"]
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    profiles: ["apps"]
    image: busybox:1.36
    command: ["sh", "-c", "echo 'worker image stub — connect Celery to adapter later'; sleep infinity"]
    depends_on:
      rabbitmq:
        condition: service_healthy

  web:
    profiles: ["apps"]
    image: busybox:1.36
    command: ["sh", "-c", "echo 'web image stub — use pnpm --filter @sonoplan/web dev locally'; sleep infinity"]

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
