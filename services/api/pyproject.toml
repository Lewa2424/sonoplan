[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sonoplan-api"
version = "0.0.0"
description = "SonoPlan FastAPI service (STG-04: projects, draft, revisions, jobs)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<0.116",
  "uvicorn[standard]>=0.32.0,<0.33",
  "pydantic>=2.9.0,<3",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14.0,<1.15",
  "psycopg[binary]>=3.2.0,<4",
  "python-dotenv>=1.0.0,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0,<0.29",
  "pytest>=8.3.0,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
